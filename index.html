<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>对枪 FACEOFF</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23080D16'/%3E%3Cpath d='M14 5a11 11 0 0 0 0 22z' fill='%232FE0CF'/%3E%3Cpath d='M18 5a11 11 0 0 1 0 22z' fill='%23E8553D'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #080D16; overflow: hidden; color: #F2EBDC;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; user-select: none; }
  #ui > * { pointer-events: none; }
  #ui .clickable, #ui .clickable * { pointer-events: auto; }
  /* 载入页（v7 深色）：标志（两个相对的半圆：我方亮青 / 敌方砖红）+ 一条来回走的亮线。只动 transform */
  #boot { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; gap: 24px; background: radial-gradient(90% 80% at 50% 45%, #16233A 0, #0B1220 55%, #070B13 100%); color: #B3BAC4; font-size: 14px; font-weight: 700; letter-spacing: .6em; text-indent: .6em; }
  #boot .mk { display: flex; gap: 8px; }
  #boot .mk i { display: block; width: 28px; height: 56px; }
  #boot .mk i:first-child { background: #2FE0CF; border-radius: 56px 0 0 56px; }
  #boot .mk i:last-child { background: #E8553D; border-radius: 0 56px 56px 0; }
  #boot .ln { width: 200px; height: 2px; background: rgba(242,235,220,.16); overflow: hidden; }
  #boot .ln i { display: block; width: 64px; height: 100%; background: #F2EBDC; animation: boot 1.1s cubic-bezier(.65,0,.35,1) infinite alternate; }
  @keyframes boot { from { transform: translateX(0); } to { transform: translateX(136px); } }
  @media (prefers-reduced-motion: reduce) { #boot .ln i { animation: none; } }
</style>
<script>/* 联机配置（可手改）：自建 PeerServer 例 { peer: 'wss://你的域名:443/', key: 'peerjs' }；换 STUN 例 { stun: ['stun:stun.miwifi.com:3478'] }。留空 = 默认（PeerJS 公共云 + 国内 STUN）*/window.FACEOFF_NET = {};</script>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui"></div>
<div id="boot"><div class="mk"><i></i><i></i></div><div id="boot-t">正在载入</div><div class="ln"><i></i></div></div>
<script src="assets/pack-00.js"></script>
<script src="assets/pack-01.js"></script>
<script src="assets/pack-02.js"></script>
<style>
#boot .pr{position:relative;width:180px;height:3px;background:rgba(15,15,18,.15);margin-top:-14px}
#boot .pr i{position:absolute;inset:0;background:#B5412F;transform:scaleX(0);transform-origin:0 0;transition:transform 120ms linear}
#boot .pn{font:700 11px/1 ui-monospace,Menlo,monospace;letter-spacing:.3em;color:#7C776E;margin-top:-10px;font-variant-numeric:tabular-nums}
#boot.err #boot-t{color:#B5412F;letter-spacing:.08em;text-indent:0;max-width:640px;text-align:center;line-height:1.6}
</style>
<script src="assets/boot.js"></script>
</body>
</html>
